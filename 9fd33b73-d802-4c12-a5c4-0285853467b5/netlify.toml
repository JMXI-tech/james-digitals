[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "20"
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
[[redirects]]
  from = "/api/projects"
  to = "/.netlify/functions/projects"
  status = 200
[[redirects]]
  from = "/api/projects/:id"
  to = "/.netlify/functions/projects?id=:id"
  status = 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
